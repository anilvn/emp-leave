spring:
  application:
    name: company-leave
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/leave}
    username: ${DB_USERNAME:leave}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
security:
  jwt:
    secret: ${JWT_SECRET:}
management:
  endpoints:
    web:
      exposure:
        include: health

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    out-of-order: true

---
spring:
  config:
    activate:
      on-profile: demo

---
spring:
  config:
    activate:
      on-profile: test
