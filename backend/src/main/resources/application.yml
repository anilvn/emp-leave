spring:
  application:
    name: company-leave
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/leave}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:anil}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
security:
  jwt:
    secret: ${JWT_SECRET:}
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
management:
  endpoints:
    web:
      exposure:
        include: health

---
spring:
  config:
    activate:
      on-profile: dev
security:
  jwt:
    secret: ${JWT_SECRET:company-leave-dev-jwt-secret-change-before-production-32-bytes}
  flyway:
    out-of-order: true

---
spring:
  config:
    activate:
      on-profile: demo

---
spring:
  config:
    activate:
      on-profile: test
