                  requestId: 101
                  kind: APPROVED
                  subject: "Your Vacation request (2026-10-30 to 2026-11-03) was approved"
                  sentAt: "2026-10-23T08:50:01Z"
        '401':
          description: No valid access_token cookie
        '403':
          $ref: '#/components/responses/Forbidden'

  # --------------------------------------------------------------- Audit
  /audit:
    get:
      tags: [Audit]
      summary: Audit trail
      description: >
        HR, view only. No filters — every call returns the full audit
        trail. One detailed report per leave request — not a flat
        action-by-action log — built from the insert-only audit log
        (FR42-FR45) and request_comments (FR15). Every employee's every
        request appears, regardless of status (PENDING, APPROVED,
        REJECTED or CANCELLED), with its full comment thread and its
        full History timeline nested inside, so HR gets the complete
        picture for every request in one call (FR24 — HR has no scope
        filter).
      x-functional-requirements: [FR42, FR43, FR44, FR45, FR15, FR24, FR26]
      responses:
