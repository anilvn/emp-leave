                detail: Only HR can view the audit trail.
                instance: /api/audit
                code: ACCESS_DENIED

components:

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: >
        Session cookie set by POST /auth/login. HttpOnly, Secure, SameSite
        cookie; 30-minute inactivity timeout (FR58). Not a bearer token in
        JavaScript-readable storage.

  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    Forbidden:
      description: >
        Caller is not allowed to see or act on this resource. A 403 here
        always writes an access-log entry (FR25, FR26).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Access denied
            status: 403
            detail: You do not have permission to access this resource.
            code: ACCESS_DENIED
    PasswordChangeRequired:
      description: >
        Caller is authenticated but holds a temporary password
        (`mustChangePassword` true) and must replace it via
        POST /auth/change-password before using any other endpoint (FR20).
        Applies to every operation except login, logout and
        change-password itself.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Password change required
            status: 403
            detail: Your temporary password must be changed before you can use this resource.
            code: PASSWORD_CHANGE_REQUIRED
    NotFound:
      description: No such resource
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Not found
            status: 404
            detail: The requested resource does not exist.
            code: NOT_FOUND
    ValidationError:
      description: Request body failed validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Validation failed
            status: 400
            detail: One or more fields failed validation.
            code: VALIDATION_FAILED

  schemas:

    # ---- enums -------------------------------------------------------
    Role:
      type: string
      description: The three RBAC roles (FR21)
      enum: [EMPLOYEE, MANAGER, HR_ADMIN]

    RequestStatus:
      type: string
      description: Leave request lifecycle status (FR4)
      enum: [PENDING, APPROVED, REJECTED, CANCELLED]

    LedgerKind:
      type: string
      description: Why a balance_ledger row was written
      enum: [SET, ADJUST, RESERVE, RELEASE, DEDUCT]

    NotificationKind:
      type: string
      description: Which event triggered sendNotification() (FR50-FR52)
      enum: [SUBMITTED, APPROVED, REJECTED]

    HistoryEntryType:
      type: string
      description: What kind of event appears on the request History tab (FR45)
      enum: [SUBMITTED, EDITED, CANCELLED, APPROVED, REJECTED, COMMENT]

    # ---- auth ----------------------------------------------------------
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
      example:
        username: emp.jsmith
        password: Passw0rd1

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          description: Minimum 8 characters, letters and numbers
      example:
        currentPassword: Temp#2026
        newPassword: Passw0rd1

    CurrentUser:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        mustChangePassword:
          type: boolean
      example:
        id: 5
        username: emp.jsmith
        role: EMPLOYEE
        mustChangePassword: false

    # ---- users -----------------------------------------------------------
    User:
      type: object
      description: >
        users table (FR18-FR20). No separate full-name or job-title column:
        a person is identified by username everywhere, and role is rendered
        as the display title (e.g. "Manager") where the UI needs one.
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        managerId:
          type: integer
          format: int64
          nullable: true
          description: Null only for the HR user(s) at the top of the chain
        mustChangePassword:
          type: boolean
        active:
          type: boolean
      example:
        id: 5
        username: emp.jsmith
        role: EMPLOYEE
        managerId: 3
        mustChangePassword: false
        active: true

    UserCreate:
      type: object
      description: >
        Body for the "Create an account" form: HR types username, role,
        manager and a temporary password. There is no full name or job
        title field — username and role (as a display label) are how a
        person is identified everywhere else in the UI. temporaryPassword
        is hashed into password_hash immediately on save and never stored
        or logged in plaintext; must_change_password is set true so the
        user is forced to replace it at first login. This is HR-chosen by
        design, unlike POST /users/{userId}/reset-password, which
        generates one instead — the two flows are intentionally
        asymmetric (see PRD Decisions).
      required: [username, role, temporaryPassword]
      properties:
        username:
          type: string
        role:
          $ref: '#/components/schemas/Role'
          description: "Role * — dropdown: Employee, Manager, HR_ADMIN"
        managerId:
          type: integer
          format: int64
          nullable: true
          description: >
            Manager * — dropdown populated from GET /users/managers.
            Required unless role is HR_ADMIN; must be the id of a user with
            role MANAGER or HR_ADMIN (top-level managers report to HR).
        temporaryPassword:
          type: string
          format: password
      example:
        username: emp.blee
        role: EMPLOYEE
        managerId: 4
        temporaryPassword: Temp#2026

    ManagerOption:
      type: object
      description: >
        One selectable option in the "Manager *" dropdown on the
        create-account form — every MANAGER plus every HR_ADMIN (FR19).
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        role:
          $ref: '#/components/schemas/Role'
      example:
        id: 3
        username: mgr.chen
        role: MANAGER

    TemporaryPassword:
      type: object
      properties:
        temporaryPassword:
          type: string
      example:
        temporaryPassword: Temp#8841

    # ---- leave requests ----------------------------------------------
    LeaveRequestCreate:
      type: object
      required: [leaveTypeId, startDate, endDate]
      properties:
        leaveTypeId:
          type: integer
          format: int64
          description: References leave_types (Vacation, Sick, Parental, Sabbatical)
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          description: Must be on or after startDate
        notes:
          type: string
          nullable: true
          description: Optional free text (FR3)
      example:
        leaveTypeId: 1
        startDate: "2026-10-29"
        endDate: "2026-11-03"
        notes: Family trip

    LeaveRequestUpdate:
      type: object
      description: >
        Same fields as LeaveRequestCreate — the edit screen reuses the create
        form, pre-filled with the request's current values (FR7).
        leaveTypeId must still reference a valid leave_types row; it is
        accepted here for form parity but the server rejects an actual change
        of type on an existing request (see the 400 LEAVE_TYPE_CHANGE_NOT_ALLOWED
        example below) — resubmit as a new request to change the leave type.
      required: [leaveTypeId, startDate, endDate]
      properties:
        leaveTypeId:
          type: integer
          format: int64
          description: Must match the request's existing leaveTypeId; changing it is rejected
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        notes:
          type: string
          nullable: true
          description: Reason/notes for the request (FR3)
      example:
        leaveTypeId: 1
        startDate: "2026-10-30"
        endDate: "2026-11-03"
        notes: Trip shortened by a day

    LeaveRequest:
      type: object
      description: leave_requests table (FR1-FR9)
      properties:
        id:
          type: integer
          format: int64
        employeeId:
          type: integer
          format: int64
        approverId:
          type: integer
          format: int64
          description: The manager (or HR, for a top-level manager's own request) who may decide
        leaveTypeId:
          type: integer
          format: int64
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        workingDays:
          type: integer
          description: Mon-Fri inclusive, holidays ignored, whole days only (FR2)
        notes:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/RequestStatus'
        submittedAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
          nullable: true
        decisionComment:
          type: string
          nullable: true
      example:
        id: 101
        employeeId: 5
        approverId: 3
        leaveTypeId: 1
        startDate: "2026-10-29"
        endDate: "2026-11-03"
        workingDays: 4
        notes: Family trip
        status: PENDING
        submittedAt: "2026-10-22T09:15:00Z"
        decidedAt: null
        decisionComment: null

    ApprovalDetail:
      description: >
        A pending request plus everything FR11's "rich request context"
        calls for — employee, dates, type, balance, recent history — and the
        comment thread (FR15), so the approver sees the full picture in one
        call instead of following up with GET /requests/{id}, .../history
        and .../comments separately.
      allOf:
        - $ref: '#/components/schemas/LeaveRequest'
        - type: object
          properties:
            employeeUsername:
              type: string
              description: Display name for the requester (users table has no separate "full name" field)
            leaveTypeName:
              type: string
              description: From leave_types.name, e.g. Vacation, Sick, Parental, Sabbatical
            balance:
              allOf:
                - $ref: '#/components/schemas/Balance'
              description: Employee's current balance for this leave type, as of right now (FR6, FR11)
            comments:
              type: array
              description: Full comment thread on the request, oldest first (FR15)
              items:
                $ref: '#/components/schemas/Comment'
            history:
              type: array
              description: Recent History timeline — submit, edits, comments — up to this pending decision (FR11, FR45)
              items:
                $ref: '#/components/schemas/HistoryEntry'
      example:
        id: 101
        employeeId: 5
        approverId: 3
        leaveTypeId: 1
        startDate: "2026-10-30"
        endDate: "2026-11-03"
        workingDays: 3
        notes: Trip shortened by a day
        status: PENDING
        submittedAt: "2026-10-22T09:15:00Z"
        decidedAt: null
        decisionComment: null
        employeeUsername: emp.jsmith
        leaveTypeName: Vacation
        balance:
          userId: 5
          leaveTypeId: 1
          totalDays: 20
          reservedDays: 3
          availableDays: 17
        comments:
          - id: 44
            requestId: 101
            authorId: 3
            body: Can you cover the Tuesday handover before you leave?
            createdAt: "2026-10-22T13:40:00Z"
          - id: 45
            requestId: 101
            authorId: 5
            body: Yes, I'll hand off to Priya before I go.
            createdAt: "2026-10-22T14:05:00Z"
        history:
          - type: SUBMITTED
            actorId: 5
            occurredAt: "2026-10-22T09:15:00Z"
            detail: Submitted Vacation, 2026-10-29 to 2026-11-03 (4 working days)
          - type: EDITED
            actorId: 5
            occurredAt: "2026-10-22T10:02:00Z"
            detail: Changed to 2026-10-30 to 2026-11-03 (3 working days)
          - type: COMMENT
            actorId: 3
            occurredAt: "2026-10-22T13:40:00Z"
            detail: Can you cover the Tuesday handover before you leave?
          - type: COMMENT
            actorId: 5
            occurredAt: "2026-10-22T14:05:00Z"
            detail: Yes, I'll hand off to Priya before I go.

    Comment:
      type: object
      description: request_comments table (FR15)
      properties:
        id:
          type: integer
          format: int64
        requestId:
          type: integer
          format: int64
        authorId:
          type: integer
          format: int64
        body:
          type: string
        createdAt:
          type: string
          format: date-time
      example:
        id: 44
        requestId: 101
        authorId: 3
        body: Can you cover the Tuesday handover before you leave?
        createdAt: "2026-10-22T13:40:00Z"

    CommentCreate:
      type: object
      required: [body]
      properties:
        body:
          type: string
      example:
        body: Can you cover the Tuesday handover before you leave?

    HistoryEntry:
      type: object
      description: One row of the request History tab timeline (FR45)
      properties:
        type:
          $ref: '#/components/schemas/HistoryEntryType'
        actorId:
          type: integer
          format: int64
        occurredAt:
          type: string
          format: date-time
        detail:
          type: string
          description: Free-text summary, e.g. the comment body or the decision comment
      example:
        type: APPROVED
        actorId: 3
        occurredAt: "2026-10-23T08:50:00Z"
        detail: Enjoy your trip!

    DecisionRequest:
      type: object
      description: >
        Body for approve/reject. comment is optional on approve, required
        and non-blank on reject (FR12, FR13).
      properties:
        comment:
          type: string
          nullable: true
      example:
        comment: Enjoy your trip!

    TeamLeaveEntry:
      type: object
      description: >
        One row of the team leave calendar (FR14), expanded with the
        request's full comment thread (FR15) and History timeline (FR45) so
        a manager or HR can see everything — the leave itself, every comment
        exchanged between employee/manager/HR, and when each change
        happened — without a second call per request.
      properties:
        requestId:
          type: integer
          format: int64
        employeeId:
          type: integer
          format: int64
        leaveTypeId:
          type: integer
          format: int64
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        workingDays:
          type: integer
        status:
          $ref: '#/components/schemas/RequestStatus'
          description: Always APPROVED for this endpoint (FR14 scopes it to approved leave)
        comments:
          type: array
          description: Full comment thread on the request, oldest first (FR15)
          items:
            $ref: '#/components/schemas/Comment'
        history:
          type: array
          description: Request History timeline — submit, edits, comments, decision, in order (FR45)
          items:
            $ref: '#/components/schemas/HistoryEntry'
      example:
        requestId: 97
        employeeId: 5
        leaveTypeId: 1
        startDate: "2026-08-10"
        endDate: "2026-08-11"
        workingDays: 2
        status: APPROVED
        comments:
          - id: 44
            requestId: 97
            authorId: 3
            body: Can you cover the Tuesday handover before you leave?
            createdAt: "2026-08-03T13:40:00Z"
          - id: 45
            requestId: 97
            authorId: 5
            body: Yes, I'll hand off to Priya before I go.
            createdAt: "2026-08-03T14:05:00Z"
        history:
          - type: SUBMITTED
            actorId: 5
            occurredAt: "2026-08-03T09:15:00Z"
            detail: Submitted Vacation, 2026-08-10 to 2026-08-11 (2 working days)
          - type: COMMENT
            actorId: 3
            occurredAt: "2026-08-03T13:40:00Z"
            detail: Can you cover the Tuesday handover before you leave?
          - type: COMMENT
            actorId: 5
            occurredAt: "2026-08-03T14:05:00Z"
            detail: Yes, I'll hand off to Priya before I go.
          - type: APPROVED
            actorId: 3
            occurredAt: "2026-08-04T09:05:00Z"
            detail: Approved, enjoy

    # ---- balances --------------------------------------------------------
    Balance:
      type: object
      description: leave_balances table; available = total - reserved (FR6, FR31)
      properties:
        userId:
          type: integer
          format: int64
        leaveTypeId:
          type: integer
          format: int64
        totalDays:
          type: integer
        reservedDays:
          type: integer
        availableDays:
          type: integer
          description: Computed as totalDays - reservedDays, never negative
      example:
        userId: 5
        leaveTypeId: 1
        totalDays: 20
        reservedDays: 4
        availableDays: 16

    BalanceSet:
      type: object
      required: [totalDays, reason]
      properties:
        totalDays:
          type: integer
          minimum: 0
        reason:
          type: string
      example:
        totalDays: 20
        reason: Annual Vacation allotment for 2027

    BalanceAdjust:
      type: object
      required: [changeDays, reason]
      properties:
        changeDays:
          type: integer
          description: Signed; positive adds days, negative removes days
        reason:
          type: string
      example:
        changeDays: 2
        reason: Carryover correction after manual review

    BalanceLedgerEntry:
      type: object
      description: balance_ledger table (FR30)
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        leaveTypeId:
          type: integer
          format: int64
        changeDays:
          type: integer
        kind:
          $ref: '#/components/schemas/LedgerKind'
        reason:
          type: string
        actorId:
          type: integer
          format: int64
        requestId:
          type: integer
          format: int64
          nullable: true
        createdAt:
          type: string
          format: date-time
      example:
        id: 501
        userId: 5
        leaveTypeId: 1
        changeDays: 2
        kind: ADJUST
        reason: Carryover correction after manual review
        actorId: 1
        requestId: null
        createdAt: "2026-10-22T16:00:00Z"

    # ---- notifications -----------------------------------------------
    Notification:
      type: object
      description: >
        notifications table (FR50-FR54). sentAt records when
        sendNotification() wrote this row and printed its log line — no
        real email was sent in this POC.
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        requestId:
          type: integer
          format: int64
        kind:
          $ref: '#/components/schemas/NotificationKind'
        subject:
          type: string
        sentAt:
          type: string
          format: date-time
      example:
        id: 231
        userId: 5
        requestId: 101
        kind: APPROVED
        subject: "Your Vacation request (2026-10-30 to 2026-11-03) was approved"
        sentAt: "2026-10-23T08:50:01Z"

    # ---- audit -------------------------------------------------------
    AuditRequestReport:
      description: >
        What GET /audit actually returns: one row per leave request, any
        status, with its full comment thread (FR15) and full History
        timeline (FR45) nested inside — built by joining audit_events,
        request_comments and leave_requests for that request. This is the
        "all details for each request" view; AuditEvent below is the raw
        underlying row shape it's assembled from, kept here for reference.
      type: object
      properties:
        requestId:
          type: integer
          format: int64
        employeeId:
          type: integer
          format: int64
        employeeUsername:
          type: string
        leaveTypeId:
          type: integer
          format: int64
        leaveTypeName:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        workingDays:
          type: integer
        status:
          $ref: '#/components/schemas/RequestStatus'
          description: Any status — PENDING, APPROVED, REJECTED or CANCELLED (unlike /team/leave, which is approved-only)
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        history:
          type: array
          items:
            $ref: '#/components/schemas/HistoryEntry'
      example:
        requestId: 97
        employeeId: 5
        employeeUsername: emp.jsmith
        leaveTypeId: 1
        leaveTypeName: Vacation
        startDate: "2026-08-10"
        endDate: "2026-08-11"
        workingDays: 2
        status: APPROVED
        comments:
          - id: 44
            requestId: 97
            authorId: 3
            body: Can you cover the Tuesday handover before you leave?
            createdAt: "2026-08-03T13:40:00Z"
          - id: 45
            requestId: 97
            authorId: 5
            body: Yes, I'll hand off to Priya before I go.
            createdAt: "2026-08-03T14:05:00Z"
        history:
          - type: SUBMITTED
            actorId: 5
            occurredAt: "2026-08-03T09:15:00Z"
            detail: Submitted Vacation, 2026-08-10 to 2026-08-11 (2 working days)
          - type: COMMENT
            actorId: 3
            occurredAt: "2026-08-03T13:40:00Z"
            detail: Can you cover the Tuesday handover before you leave?
          - type: COMMENT
            actorId: 5
            occurredAt: "2026-08-03T14:05:00Z"
            detail: Yes, I'll hand off to Priya before I go.
          - type: APPROVED
            actorId: 3
            occurredAt: "2026-08-04T09:05:00Z"
            detail: Approved, enjoy

    AuditEvent:
      type: object
      description: >
        Not referenced by any path below — kept as the raw audit_events
        table shape (FR42-FR44) that AuditRequestReport above is assembled
        from. Comments are audit events too (action REQUEST_COMMENT_ADDED,
        entity REQUEST_COMMENT) so "what action, by whom, when" includes the
        discussion thread, not just decisions. actorUsername is a display
        join on actorId, added so HR doesn't have to resolve ids by hand.
      properties:
        id:
          type: integer
          format: int64
        entity:
          type: string
          description: e.g. LEAVE_REQUEST, USER, BALANCE, REQUEST_COMMENT
        entityId:
          type: integer
          format: int64
        action:
          type: string
          description: >
            Action code, e.g. LEAVE_REQUEST_SUBMITTED, LEAVE_REQUEST_APPROVED,
            LEAVE_REQUEST_REJECTED, REQUEST_COMMENT_ADDED, USER_CREATED,
            LEAVE_BALANCE_SET, LEAVE_BALANCE_ADJUSTED
        actorId:
          type: integer
          format: int64
        actorUsername:
          type: string
          description: Display join on actorId — who performed this action
        detailsJson:
          type: object
          additionalProperties: true
          description: >
            Action-specific payload. For REQUEST_COMMENT_ADDED this includes
            requestId and the comment body, so the comment text itself shows
            up in the audit trail alongside its timestamp and author.
        createdAt:
          type: string
          format: date-time
      example:
        id: 1050
        entity: REQUEST_COMMENT
        entityId: 101
        action: REQUEST_COMMENT_ADDED
        actorId: 5
        actorUsername: emp.jsmith
        detailsJson:
          requestId: 101
          comment: Yes, I'll hand off to Priya before I go.
        createdAt: "2026-10-22T14:05:00Z"

    # ---- errors --------------------------------------------------------
    ProblemDetail:
      type: object
      description: >
        RFC 9457 problem response used for every non-2xx response. Not
        explicit in the PRD; added here so every error path in this spec has
        one consistent shape.
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        code:
          type: string
          description: >
            Machine-readable error code, drawn from one canonical enum
            (AD-11). The full set used by this contract: ACCESS_DENIED,
            VALIDATION_FAILED, INVALID_TRANSITION, INSUFFICIENT_BALANCE,
            NOT_FOUND, INVALID_CREDENTIALS, LEAVE_TYPE_CHANGE_NOT_ALLOWED,
            COMMENT_REQUIRED, ACCOUNT_LOCKED, PASSWORD_CHANGE_REQUIRED.
          enum:
            - ACCESS_DENIED
            - VALIDATION_FAILED
            - INVALID_TRANSITION
            - INSUFFICIENT_BALANCE
            - NOT_FOUND
            - INVALID_CREDENTIALS
            - LEAVE_TYPE_CHANGE_NOT_ALLOWED
            - COMMENT_REQUIRED
            - ACCOUNT_LOCKED
            - PASSWORD_CHANGE_REQUIRED
      example:
        type: about:blank
        title: Insufficient balance
        status: 409
        detail: Requested 4 working days of Vacation but only 2 days are available.
        instance: /api/requests
        code: INSUFFICIENT_BALANCE
