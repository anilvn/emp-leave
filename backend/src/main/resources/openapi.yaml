                  employeeUsername: emp.alee
                  leaveTypeId: 2
                  leaveTypeName: Sick
                  startDate: "2026-09-21"
                  endDate: "2026-09-21"
                  workingDays: 1
                  status: APPROVED
                  comments: []
                  history:
                    - type: SUBMITTED
                      actorId: 6
                      occurredAt: "2026-09-18T07:50:00Z"
