$kind: http-request
name: '7a. POST /users as EMPLOYEE - expect 403'
method: POST
url: '{{BASE}}/users'
order: 13000
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: 'access_token={{employeeAccessToken}}'
body:
  type: json
  content: |-
    {"username":"blocked.create","role":"EMPLOYEE","managerId":3,"temporaryPassword":"Temp#2026"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Employee creation is denied", () => pm.response.to.have.status(403));
