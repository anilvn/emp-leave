$kind: http-request
method: GET
url: '{{BASE}}/users'
order: 16000
headers:
  - key: Cookie
    value: 'access_token={{hrAccessToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Response contains an account list", () => {
        const json = pm.response.json();
        const list = Array.isArray(json) ? json : (json.content || json.users);
        pm.expect(list).to.be.an("array");
        pm.expect(list.length).to.be.above(0);
      });
