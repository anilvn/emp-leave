$kind: http-request
method: POST
url: "{{BASE}}/auth/login"
order: 1000
headers:
  Content-Type: application/json
body:
  type: json
  content: "{\r

    \    \"username\": \"hr.admin\",\r

    \    \"password\": \"Passw0rd1\"\r

    }"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Login succeeds", () => pm.expect(pm.response.code).to.be.oneOf([200, 204]));
      const cookie = pm.response.headers.get("Set-Cookie") || "";
      const match = cookie.match(/access_token=([^;]+)/i);
      pm.test("HR access token cookie is returned", () => pm.expect(match).to.not.equal(null));
      if (match) pm.collectionVariables.set("hrAccessToken", match[1]);
    language: text/javascript
