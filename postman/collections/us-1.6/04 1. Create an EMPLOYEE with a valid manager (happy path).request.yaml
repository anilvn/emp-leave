$kind: http-request
method: POST
url: '{{BASE}}/users'
order: 4000
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: 'access_token={{hrAccessToken}}'
body:
  type: json
  content: |-
    {"username":"emp.new1","role":"EMPLOYEE","managerId":3,"temporaryPassword":"Temp#2026"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      const json = pm.response.json();
      pm.test("Created employee fields are correct", () => {
        pm.expect(json.id).to.exist;
        pm.expect(json.username).to.eql("emp.new1");
        pm.expect(json.role).to.eql("EMPLOYEE");
        pm.expect(json.managerId).to.eql(3);
        pm.expect(json.mustChangePassword).to.eql(true);
        pm.expect(json.active).to.eql(true);
      });
      pm.test("No plaintext temporary password", () => {
        pm.expect(json).to.not.have.property("temporaryPassword");
        pm.expect(pm.response.text()).to.not.include("Temp#2026");
      });
