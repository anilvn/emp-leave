$kind: http-request
method: POST
url: '{{BASE}}/users'
order: 7000
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: 'access_token={{hrAccessToken}}'
body:
  type: json
  content: |-
    {"username":"emp.new3","role":"EMPLOYEE","managerId":5,"temporaryPassword":"Temp#2026"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));
      pm.test("Non-manager is rejected", () => {
        const json = pm.response.json();
        pm.expect(json.code).to.eql("VALIDATION_FAILED");
        pm.expect(json.detail).to.include("emp.jsmith");
        pm.expect(json.detail).to.include("EMPLOYEE");
      });
