$kind: http-request
method: POST
url: '{{BASE}}/users'
order: 5000
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: 'access_token={{hrAccessToken}}'
body:
  type: json
  content: |-
    {"username":"hr.new1","role":"HR_ADMIN","temporaryPassword":"Temp#2026"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      const json = pm.response.json();
      pm.test("Created HR admin has no manager", () => {
        pm.expect(json.username).to.eql("hr.new1");
        pm.expect(json.role).to.eql("HR_ADMIN");
        pm.expect(json.managerId).to.eql(null);
      });
      pm.test("No plaintext temporary password", () => {
        pm.expect(json).to.not.have.property("temporaryPassword");
        pm.expect(pm.response.text()).to.not.include("Temp#2026");
      });
