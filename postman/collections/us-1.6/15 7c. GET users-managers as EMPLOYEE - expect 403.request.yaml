$kind: http-request
name: '7c. GET /users/managers as EMPLOYEE - expect 403'
method: GET
url: '{{BASE}}/users/managers'
order: 15000
headers:
  - key: Cookie
    value: 'access_token={{employeeAccessToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Employee manager-list access is denied", () => pm.response.to.have.status(403));
