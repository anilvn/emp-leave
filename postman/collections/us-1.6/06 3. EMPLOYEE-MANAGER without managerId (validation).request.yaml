$kind: http-request
name: '3. EMPLOYEE/MANAGER without managerId (validation)'
method: POST
url: '{{BASE}}/users'
order: 6000
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: 'access_token={{hrAccessToken}}'
body:
  type: json
  content: |-
    {"username":"emp.new2","role":"EMPLOYEE","temporaryPassword":"Temp#2026"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));
      pm.test("Problem response describes required manager", () => {
        const json = pm.response.json();
        pm.expect(json.code).to.eql("VALIDATION_FAILED");
        pm.expect(json.detail).to.include("managerId is required when role is EMPLOYEE or MANAGER.");
      });
