$kind: http-request
url: "{{baseUrl}}/users/{{rajeshId}}/reset-password"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test('HR reset password succeeds', function () { pm.response.to.have.status(200); });
      const reset = pm.response.json();
      pm.test('Temporary password is returned', function () { pm.expect(reset.temporaryPassword).to.be.a('string').and.not.empty; });
      pm.environment.set('resetPassword', reset.temporaryPassword);
    language: text/javascript
order: 1000
