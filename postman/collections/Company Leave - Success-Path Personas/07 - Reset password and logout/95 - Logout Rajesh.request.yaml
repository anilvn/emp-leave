$kind: http-request
url: "{{baseUrl}}/auth/logout"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test('Logout succeeds', function () { pm.response.to.have.status(204); });
      pm.test('Auth cookie is cleared', function () { const cookie = (pm.response.headers.get('Set-Cookie') || '').toLowerCase(); pm.expect(cookie).to.include('access_token=;'); pm.expect(cookie).to.include('max-age=0'); });
    language: text/javascript
order: 5000
