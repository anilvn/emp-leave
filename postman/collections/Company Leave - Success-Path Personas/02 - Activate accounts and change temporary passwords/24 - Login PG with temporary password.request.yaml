$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"username":"{{pgUsername}}","password":"{{temporaryPassword}}"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Login succeeds for PG with temporary password', function () { pm.response.to.have.status(200); });
      const user = pm.response.json();
      pm.test('Identity and role are PG with temporary password', function () { pm.expect(user.username).to.eql(pm.environment.get('pgUsername')); pm.expect(user.role).to.eql('EMPLOYEE'); pm.expect(user.mustChangePassword).to.eql(true); });
      pm.environment.set('pgId', String(user.id));
      pm.test('Secure access cookie is issued', function () { pm.expect(pm.response.headers.get('Set-Cookie') || '').to.include('access_token='); });
    language: text/javascript
order: 13000
