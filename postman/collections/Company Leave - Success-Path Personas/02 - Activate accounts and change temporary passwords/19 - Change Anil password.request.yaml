$kind: http-request
url: "{{baseUrl}}/auth/change-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"currentPassword":"{{temporaryPassword}}","newPassword":"{{newPassword}}"}'
scripts:
  - type: afterResponse
    code: pm.test('Password changed successfully', function () { pm.response.to.have.status(204); });
    language: text/javascript
order: 8000
