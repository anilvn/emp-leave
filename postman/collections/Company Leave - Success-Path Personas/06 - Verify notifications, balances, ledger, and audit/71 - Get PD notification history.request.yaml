$kind: http-request
url: "{{baseUrl}}/notifications"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('PD notifications load', function () { pm.response.to.have.status(200); });
      pm.test('PD received submissions from all four employees and Sunil approval notification', function () { const n = pm.response.json(); ['approvedRequestId','rejectedRequestId','cancelledRequestId','pendingRequestId'].forEach(function (id) { pm.expect(n.some(function (x) { return String(x.requestId) === pm.environment.get(id) && x.kind === 'SUBMITTED'; })).to.eql(true); }); pm.expect(n.some(function (x) { return String(x.requestId) === pm.environment.get('pdRequestId') && x.kind === 'APPROVED'; })).to.eql(true); });
    language: text/javascript
order: 1000
