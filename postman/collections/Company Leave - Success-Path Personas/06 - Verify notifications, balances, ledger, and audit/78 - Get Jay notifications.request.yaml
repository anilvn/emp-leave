$kind: http-request
url: "{{baseUrl}}/notifications"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Jay notifications load', function () { pm.response.to.have.status(200); });
      pm.test('Jay received rejection notification', function () { pm.expect(pm.response.json().some(function (n) { return String(n.requestId) === pm.environment.get('rejectedRequestId') && n.kind === 'REJECTED'; })).to.eql(true); });
    language: text/javascript
order: 8000
