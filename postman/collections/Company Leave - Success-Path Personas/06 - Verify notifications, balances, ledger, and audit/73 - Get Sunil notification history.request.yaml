$kind: http-request
url: "{{baseUrl}}/notifications"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Sunil notifications load', function () { pm.response.to.have.status(200); });
      pm.test('Sunil received PD submission notification', function () { const n = pm.response.json(); pm.expect(n.some(function (x) { return String(x.requestId) === pm.environment.get('pdRequestId') && x.kind === 'SUBMITTED'; })).to.eql(true); });
    language: text/javascript
order: 3000
