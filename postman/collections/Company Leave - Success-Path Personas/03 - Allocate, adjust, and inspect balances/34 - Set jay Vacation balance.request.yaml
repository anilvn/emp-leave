$kind: http-request
url: "{{baseUrl}}/balances/{{jayId}}/{{vacationTypeId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"totalDays":20,"reason":"Postman success-path test allocation"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Balance set succeeds', function () { pm.response.to.have.status(200); });
      const balance = pm.response.json();
      pm.test('Balance allocation is 20 days', function () { pm.expect(String(balance.userId)).to.eql(pm.environment.get('jayId')); pm.expect(balance.totalDays).to.eql(20); pm.expect(balance.reservedDays).to.eql(0); });
    language: text/javascript
order: 5000
