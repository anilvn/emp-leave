$kind: http-request
url: "{{baseUrl}}/balances/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Employee can read personal balances', function () { pm.response.to.have.status(200); });
      pm.test('Anil has the allocated Vacation balance', function () { const b = pm.response.json().find(function (x) { return String(x.leaveTypeId) === pm.environment.get('vacationTypeId'); }); pm.expect(b).to.be.an('object'); pm.expect(b.totalDays).to.eql(21); });
    language: text/javascript
order: 10000
