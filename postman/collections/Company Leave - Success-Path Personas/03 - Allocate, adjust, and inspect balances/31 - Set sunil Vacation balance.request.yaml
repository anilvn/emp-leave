$kind: http-request
url: "{{baseUrl}}/balances/{{sunilId}}/{{vacationTypeId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: "{\r

    \    \"totalDays\": 100,\r

    \    \"reason\": \"Postman success-path test allocation\"\r

    }"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Balance set succeeds', function () { pm.response.to.have.status(200); });
      const balance = pm.response.json();
      pm.test('Balance allocation is 20 days', function () { pm.expect(String(balance.userId)).to.eql(pm.environment.get('sunilId')); pm.expect(balance.totalDays).to.eql(20); pm.expect(balance.reservedDays).to.eql(0); });
    language: text/javascript
order: 2000
