$kind: http-request
url: "{{baseUrl}}/approvals/pending"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Sunil pending approvals load', function () { pm.response.to.have.status(200); });
      pm.test('Sunil sees PD request assigned to Sunil', function () { pm.expect(pm.response.json().some(function (r) { return String(r.id) === pm.environment.get('pdRequestId') && String(r.approverId) === pm.environment.get('sunilId'); })).to.eql(true); });
    language: text/javascript
order: 8000
