$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"username":"{{pdUsername}}","password":"{{newPassword}}"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Login succeeds for PD to review direct reports', function () { pm.response.to.have.status(200); });
      const user = pm.response.json();
      pm.test('Identity and role are PD to review direct reports', function () { pm.expect(user.username).to.eql(pm.environment.get('pdUsername')); pm.expect(user.role).to.eql('MANAGER'); pm.expect(user.mustChangePassword).to.eql(false); });
      pm.environment.set('pdId', String(user.id));
      pm.test('Secure access cookie is issued', function () { pm.expect(pm.response.headers.get('Set-Cookie') || '').to.include('access_token='); });
    language: text/javascript
order: 1000
