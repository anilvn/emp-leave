$kind: http-request
url: "{{baseUrl}}/notifications"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('PD notification history loads', function () { pm.response.to.have.status(200); });
      pm.test('PD received direct-report submission notification', function () { pm.expect(pm.response.json().some(function (n) { return String(n.requestId) === pm.environment.get('approvedRequestId') && n.kind === 'SUBMITTED'; })).to.eql(true); });
    language: text/javascript
order: 6000
