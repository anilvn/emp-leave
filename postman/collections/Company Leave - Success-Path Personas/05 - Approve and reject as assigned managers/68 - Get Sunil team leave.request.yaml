$kind: http-request
url: "{{baseUrl}}/team/leave?from={{dateA}}&to={{dateD}}"
method: GET
queryParams:
  from: "{{dateA}}"
  to: "{{dateD}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Sunil team calendar loads', function () { pm.response.to.have.status(200); });
      pm.test('Sunil sees PD approved leave', function () { pm.expect(pm.response.json().some(function (r) { return String(r.requestId) === pm.environment.get('pdRequestId'); })).to.eql(true); });
    language: text/javascript
order: 10000
