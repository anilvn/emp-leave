$kind: http-request
url: "{{baseUrl}}/users/managers"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HR can list manager options', function () { pm.response.to.have.status(200); });
      pm.test('HR is available as a manager', function () { pm.expect(pm.response.json().some(function (u) { return String(u.id) === pm.environment.get('hrId'); })).to.eql(true); });
    language: text/javascript
order: 3000
