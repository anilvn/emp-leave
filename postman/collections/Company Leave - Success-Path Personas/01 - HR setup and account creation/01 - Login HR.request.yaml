$kind: http-request
description: |-
  Authenticates the HR administrator using the configured `hrUsername` and `seedPassword` environment variables.

  A successful response returns the HR user record, confirms the `HR_ADMIN` role, and issues a secure `access_token` cookie for subsequent authenticated requests. The response script stores the returned user ID in the `hrId` environment variable.

  Expected result: HTTP 200, `mustChangePassword` is `false`, and the response includes a `Set-Cookie` header containing `access_token=`.
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"username":"{{hrUsername}}","password":"{{seedPassword}}"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Login succeeds for HR', function () { pm.response.to.have.status(200); });
      const user = pm.response.json();
      pm.test('Identity and role are HR', function () { pm.expect(user.username).to.eql(pm.environment.get('hrUsername')); pm.expect(user.role).to.eql('HR_ADMIN'); pm.expect(user.mustChangePassword).to.eql(false); });
      pm.environment.set('hrId', String(user.id));
      pm.test('Secure access cookie is issued', function () { pm.expect(pm.response.headers.get('Set-Cookie') || '').to.include('access_token='); });
    language: text/javascript
order: 1000
