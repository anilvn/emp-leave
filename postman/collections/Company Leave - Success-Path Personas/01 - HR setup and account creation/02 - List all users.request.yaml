$kind: http-request
url: "{{baseUrl}}/users"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HR can list users', function () { pm.response.to.have.status(200); });
      pm.test('Configured HR account is present', function () { pm.expect(pm.response.json().some(function (u) { return u.username === pm.environment.get('hrUsername'); })).to.eql(true); });
    language: text/javascript
order: 2000
