services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: leave
      POSTGRES_USER: ${DB_USERNAME:-leave}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-leave}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
